<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHMO · B</title>
<link rel="stylesheet" href="base.css"><style>
body{background:#C8F532;color:#2a0f66;min-height:100vh;overflow:hidden;height:100vh}
.bl{position:fixed;border-radius:50%;filter:blur(0);will-change:transform;transition:translate .4s ease-out}
.b1{width:60vmax;height:60vmax;background:#7B3FF2;left:-18vmax;bottom:-30vmax;border-radius:46% 54% 60% 40%/50% 40% 60% 50%;animation:mo 14s ease-in-out infinite alternate}
.b2{width:34vmax;height:34vmax;background:#FF6A2B;right:-8vmax;top:-12vmax;border-radius:60% 40% 50% 50%;animation:mo 11s ease-in-out infinite alternate-reverse}
.b3{width:16vmax;height:16vmax;background:#FF9BD2;right:12vw;bottom:14vh;animation:mo 9s ease-in-out infinite alternate}
@keyframes mo{to{transform:rotate(40deg) scale(1.08) translate(2%,3%)}}
.ring{position:fixed;width:20vmin;height:20vmin;border:3.2vmin solid #fff;border-radius:50%;left:9vw;top:12vh;animation:sp 20s linear infinite;mix-blend-mode:normal}
@keyframes sp{to{transform:rotate(360deg) translateY(10px)}}
.star{position:fixed;width:11vmin;color:#fff;animation:sp 16s linear infinite}
.star.a{right:18vw;top:18vh;color:#FF4B3E}.star.b{left:14vw;bottom:20vh;color:#fff;width:8vmin}
.hero{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;padding:20px}
h1{font:400 clamp(110px,27vw,420px)/.82 'Bagel',sans-serif;color:#FF8FD0;letter-spacing:-.01em;position:relative;--x:0;--y:0;
 text-shadow:0 0 0 #0000,calc(var(--x)*1px) calc(var(--y)*1px + 2px) 0 #7B3FF2,calc(var(--x)*2px) calc(var(--y)*2px + 4px) 0 #7B3FF2,calc(var(--x)*3px) calc(var(--y)*3px + 6px) 0 #6A2FE0,calc(var(--x)*4px) calc(var(--y)*4px + 8px) 0 #6A2FE0,calc(var(--x)*5px) calc(var(--y)*5px + 10px) 0 #5A22CC,calc(var(--x)*6px) calc(var(--y)*6px + 12px) 0 #5A22CC,calc(var(--x)*7px) calc(var(--y)*7px + 14px) 0 #4A18B4,calc(var(--x)*8px) calc(var(--y)*8px + 16px) 0 #4A18B4,0 38px 40px #2a0f6666;
 animation:bob 3.4s ease-in-out infinite}
h1::after{content:"SHMO";text-shadow:none;position:absolute;inset:0;color:transparent;background:linear-gradient(160deg,#fff9 0 18%,#fff0 40%);-webkit-background-clip:text;background-clip:text;pointer-events:none}
@keyframes bob{50%{transform:translateY(-12px) rotate(-1.2deg)}}
.sub{font:800 clamp(18px,2.6vw,32px)/1.1 'Anybody',sans-serif;font-stretch:90%;text-transform:uppercase;letter-spacing:.02em}
.sub i{font:italic 500 1.1em 'Bodoni',serif;text-transform:none}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{background:#2a0f66;border-color:#2a0f66;box-shadow:0 5px 0 #0004}.btn.o{background:#fff;color:#2a0f66;border-color:#2a0f66}
.sticker{position:fixed;z-index:4;width:clamp(110px,12.5vw,190px);background:#fff;padding:8px 8px 26px;border-radius:10px;box-shadow:0 14px 30px #0005;cursor:grab;touch-action:none;user-select:none;transition:box-shadow .2s}
.sticker img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;display:block;pointer-events:none}
.sticker.drag{cursor:grabbing;box-shadow:0 26px 40px #0007;z-index:9}
.sticker span{position:absolute;bottom:6px;left:0;right:0;text-align:center;font:600 10px 'Anybody',sans-serif;font-stretch:120%;letter-spacing:.08em}
.hint{position:fixed;top:18px;left:0;right:0;text-align:center;font:600 12px 'Anybody',sans-serif;font-stretch:118%;letter-spacing:.08em;text-transform:uppercase;z-index:5}
@media(max-width:700px){.sticker{width:30vw}.sticker:nth-child(n+3){display:none}.hint{display:none}}
</style></head><body>

<script>
var P=[['s03',4,16,-8,'MOTION'],['s14',77,12,7,'COMMERCIAL'],["s17",3,60,6,"SPORT"],['s06',72,58,-6,'WEB'],["s02",24,76,4,"GRADE"],['s13',87,38,-4,'FRAMES']];
var st=document.getElementById('st');
P.forEach(function(p,i){var d=document.createElement('div');d.className='sticker';d.style.left=p[1]+'vw';d.style.top=p[2]+'vh';d.style.rotate=p[3]+'deg';
 d.innerHTML='<img alt="" src="../media/stills/'+p[0]+'.webp"><span>'+p[4]+'</span>';st.appendChild(d);
 var sx,sy,ox,oy;d.addEventListener('pointerdown',function(e){d.setPointerCapture(e.pointerId);d.classList.add('drag');sx=e.clientX;sy=e.clientY;ox=d.offsetLeft;oy=d.offsetTop;d.style.rotate='0deg'});
 d.addEventListener('pointermove',function(e){if(!d.classList.contains('drag'))return;d.style.left=(ox+e.clientX-sx)+'px';d.style.top=(oy+e.clientY-sy)+'px'});
 d.addEventListener('pointerup',function(){d.classList.remove('drag');d.style.rotate=(Math.random()*12-6)+'deg'})});
var H=document.getElementById('h'),bl=[].slice.call(document.querySelectorAll('.bl'));
if(matchMedia('(hover:hover)').matches)addEventListener('pointermove',function(e){var x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
 H.style.setProperty('--x',(-x*2.2).toFixed(2));H.style.setProperty('--y',(-y*2.2).toFixed(2));
 bl.forEach(function(b,i){b.style.translate=(x*-40*(i+1))+'px '+(y*-40*(i+1))+'px'})});
</script></body></html>
