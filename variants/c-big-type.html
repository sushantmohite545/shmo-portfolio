<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHMO · C</title>
<link rel="stylesheet" href="base.css"><style>
body{background:#F4EFE6;color:#111;min-height:100vh;overflow:hidden;height:100vh}
.stack{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 2vw;gap:0}
.w{font:900 clamp(90px,23vh,300px)/.84 'Anybody',sans-serif;font-stretch:62%;text-transform:uppercase;white-space:nowrap;letter-spacing:-.01em;
 color:transparent;-webkit-text-stroke:2px #111;background-size:160%;background-clip:text;-webkit-background-clip:text;transition:-webkit-text-stroke .3s;cursor:default;display:block;width:max-content;max-width:100%}
.w:hover{-webkit-text-stroke:0}
.w.a{background-image:url(../media/stills/s03.webp);background-position:var(--px,50%) var(--py,50%)}
.w.b{background-image:url(../media/stills/s07.webp);align-self:flex-end;background-position:var(--px,50%) var(--py,50%)}
.w.c{background-image:url(../media/stills/s05.webp);background-position:var(--px,50%) var(--py,50%)}
.w.s{font-stretch:120%;color:#FF4B3E;-webkit-text-stroke:0;background:none;font-size:clamp(70px,19vh,240px)}
.band{position:fixed;left:-10vw;right:-10vw;overflow:hidden;white-space:nowrap;background:#111;color:#C6F432;font:800 clamp(14px,2vw,22px) 'Anybody',sans-serif;font-stretch:120%;letter-spacing:.1em;text-transform:uppercase;padding:12px 0;z-index:3}
.band.t{top:8vh;transform:rotate(-3deg)}.band.u{bottom:11vh;transform:rotate(2.5deg);background:#FF6A2B;color:#111}
.band span{display:inline-block;animation:mq 26s linear infinite}
.band.u span{animation-direction:reverse}
@keyframes mq{to{transform:translateX(-50%)}}
.corner{position:fixed;z-index:4;font:600 12px/1.3 'Anybody',sans-serif;font-stretch:118%;letter-spacing:.08em;text-transform:uppercase}
.tl{display:none}.br{right:20px;bottom:calc(11vh + 70px);text-align:right}
.cta{position:fixed;left:2vw;bottom:2vh;z-index:5;display:flex;gap:10px;padding-bottom:56px}
.dot{position:fixed;width:120px;height:120px;border-radius:50%;background:#7B3FF2;z-index:2;right:8vw;top:24vh;display:grid;place-items:center;font:900 13px 'Anybody',sans-serif;font-stretch:120%;color:#fff;text-align:center;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.w{font-size:20vw;font-stretch:70%}.w.s{font-size:18vw}.dot{display:none}.cta{bottom:calc(11vh + 60px);padding-bottom:0;left:16px}.corner.tl,.corner.br{display:none}}
</style></head><body>
<div class="band t"><span id="m1"></span></div><div class="band u"><span id="m2"></span></div>
<div class="corner tl">Sushant Mohite<br>Mumbai</div><div class="corner br">Video editing<br>Motion design</div>
<div class="dot">4.5<br>YRS</div>
<div class="stack" id="stk"><span class="w a">Cut it.</span><span class="w s">Move it.</span><span class="w b">Colour it.</span></div>
<div class="cta"><a class="btn" href="../index.html#work">See the work</a><a class="btn o" href="mailto:sushant.mohite545@gmail.com">Say hi</a></div>
<nav class="sw"><a href="a-poster-wall.html" class="">A · WALL</a><a href="b-sticker-pop.html" class="">B · POP</a><a href="c-big-type.html" class="on">C · TYPE</a></nav>
<script>
var t='SHMO &nbsp;✦&nbsp; MOTION &nbsp;✦&nbsp; EDIT &nbsp;✦&nbsp; COLOUR &nbsp;✦&nbsp; SOUND &nbsp;✦&nbsp; ';
['m1','m2'].forEach(function(i){document.getElementById(i).innerHTML=t.repeat(10)});
var s=document.getElementById('stk');
addEventListener('pointermove',function(e){s.style.setProperty('--px',(e.clientX/innerWidth*100)+'%');s.style.setProperty('--py',(e.clientY/innerHeight*100)+'%')});
</script></body></html>
